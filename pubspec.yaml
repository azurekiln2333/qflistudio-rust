name: qfli_rust
description: "QFLIRustCore：Rust 编辑器与桌面工具链入口。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qfli_studio_core

  path: ^1.9.1
  ffi: ^2.2.0

  cupertino_icons: ^1.0.8

dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  integration_test:
    sdk: flutter
  re_editor: ^0.10.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/miri/
    - assets/content_rust/
