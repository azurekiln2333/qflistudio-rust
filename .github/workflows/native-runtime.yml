name: Native runtime

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also build the optional macOS x64 native runtime
        type: boolean
        default: false
  push:
    branches: [ci/native-runtime, main, master, feat/rust-offline-ide-20261022]
    paths:
      - '.github/workflows/native-runtime.yml'
      - 'native/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guest:
    name: Shared Linux x64 MIR data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Select mobile targets
        id: targets
        env:
          INCLUDE_MACOS: ${{ inputs.include_macos || false }}
        run: echo "matrix=$(python scripts/ci_native_runtime.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Build pinned MIR guest data
        run: >-
          python -u scripts/ci_native_runtime.py guest
          --work-root "${{ runner.temp }}/qfli-native"
          --output-root build/native-ci
      - name: Upload shared guest data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-guest-sysroot
          path: build/native-ci/guest-sysroot.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload guest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-guest
          path: build/native-ci/logs
          retention-days: 14

  runtime:
    name: ${{ matrix.package }}
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guest.outputs.matrix).include }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Android NDK
        if: startsWith(matrix.package, 'android-')
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973'
          echo "QFLI_ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install verified OpenHarmony SDK
        if: startsWith(matrix.package, 'ohos-')
        shell: bash
        run: |
          python scripts/ci_ohos_sdk.py --destination "${{ runner.temp }}/qfli-ohos-sdk" --output build/native-ci/logs/ohos-sdk.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path('build/native-ci/logs/ohos-sdk.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"QFLI_OHOS_SDK={record['nativeSdk']}\n")
              output.write(f"QFLI_OHOS_RESOURCE_DIR={record['resourceDir']}\n")
          PY
      - name: Download shared guest data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-guest-sysroot
          path: build/native-guest
      - name: Build compiler, adapter and runtime package
        run: >-
          python -u scripts/ci_native_runtime.py runtime
          --work-root "${{ runner.temp }}/qfli-native"
          --output-root build/native-ci
          --native-host ${{ matrix.host }}
          --build-host ${{ matrix.build_host }}
          --guest-archive build/native-guest/guest-sysroot.tar.gz
      - name: Upload native runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.package }}
          path: build/native-ci/native-runtime-${{ matrix.package }}.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-${{ matrix.package }}
          path: build/native-ci/logs
          retention-days: 14
