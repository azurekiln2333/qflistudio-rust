name: Native runtime

on:
  workflow_dispatch:
  push:
    branches: [ci/native-runtime, main, master, feat/rust-offline-ide-20261022]
    paths:
      - '.github/workflows/native-runtime.yml'
      - 'native/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    name: Shared Linux x64 MIR data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build pinned MIR guest data
        run: >-
          python -u scripts/ci_native_runtime.py guest
          --work-root "${{ runner.temp }}/qfli-native"
          --output-root build/native-ci
      - name: Upload shared guest data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-guest-sysroot
          path: build/native-ci/guest-sysroot.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload guest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-guest
          path: build/native-ci/logs
          retention-days: 14

  runtime:
    name: ${{ matrix.package }}
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            package: linux-x64
          - os: windows-2022
            host: x86_64-pc-windows-gnu
            package: windows-x64
          - os: macos-15
            host: aarch64-apple-darwin
            package: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Linux compiler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
      - name: Install Windows GNU tools
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc patch
      - name: Expose Windows GNU tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS2_LOCATION 'usr\bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          (Join-Path $env:MSYS2_LOCATION 'mingw64\bin') | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Download shared guest data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-guest-sysroot
          path: build/native-guest
      - name: Build compiler, adapter and runtime package
        run: >-
          python -u scripts/ci_native_runtime.py runtime
          --work-root "${{ runner.temp }}/qfli-native"
          --output-root build/native-ci
          --native-host ${{ matrix.host }}
          --guest-archive build/native-guest/guest-sysroot.tar.gz
      - name: Upload native runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.package }}
          path: build/native-ci/native-runtime-${{ matrix.package }}.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-diagnostics-${{ matrix.package }}
          path: build/native-ci/logs
          retention-days: 14
